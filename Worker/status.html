<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGreen Worker Pickup Status</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Worker.css">
</head>
<body>
    
    <header>
        <div class="logo">
        <img src="image/recycle_imag.png" alt="GoGreen Logo">
            GoGreen Worker
        </div>
    </header>

    <section class="dashboard">

        <h1>Pickup Status</h1>
        
        <div class="card-container">
            <div class="card">
                <h2>Recylce BIN 1</h2>
                <p>Fakulti Teknologi Maklumat dan Komunikasi</p>
                <p>Status: <span class="status assigned">Pending</span></p>
                
            </div>

            <div class="card">
              <h2>Recylce BIN 2</h2>
                <p>Masjid UTeM</p>
                <p>Status: <span class="status progress">In Progress</span></p>
            </div>

            <div class="card">
                <h2>Recylce BIN 3</h2>
                <p>Kolej Satria</p>
                <p>Status: <span class="status completed">Completed</span></p>
            </div>

        </div>

    </section>


</body>
</html>
