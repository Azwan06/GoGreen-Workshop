<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGreen</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <div class="logo">
        <img src="image/recycle_imag.png" alt="GoGreen Logo">
            GoGreen
        </div>

        <nav id="navMenu">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="media.html">Media</a>
            <a href="map.html">Map</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="contactus.html">Contact</a>

            <button class="sign-btn"  onclick="window.location.href='login.html'">
                Sign In
            </button>

        </nav>
        <div class="menu-toggle" onclick="toggleMenu()">
            ☰
        </div>
    </header>

    <section class="login-container">
        <div class="login-box">
            <h1>Welcome Back</h1>
            <p>Sign in with email or username</p>
            <input type="text" placeholder="Enter Email or Username" class="input-box">
            <input type="password" placeholder="Password" class="input-box">
            
            <button class="signin-btn">
                Sign In
            </button>

            <div class="or">
                OR
            </div>

            <button class="google-btn">
                Continue with Google
            </button>

            <div class="bottom-text">
                Don't have an account
                <a href="#" class="signup">Sign Up</a>
            </div>


        </div>
    </section>

    <script>

        function toggleMenu(){
        document
        .getElementById("navMenu")
        .classList.toggle("active");
        }

    </script>
</body>
</html>
