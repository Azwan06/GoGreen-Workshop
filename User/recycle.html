<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="recycle.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="../public/image/recycle_imag.png" alt="GoGreen Logo">
      <span>GoGreen</span>
    </div>
    <nav id="navMenu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="media.html">Media</a>
      <a href="map.html">Map</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="contactus.html">Contact</a>
      <button class="sign-btn" onclick="window.location.href='login.html'">
        Sign In
      </button>
    </nav>
    <div class="menu-toggle" onclick="toggleMenu()">
      ☰
    </div>
  </header>
<main class="form-page-container">
        <h1 class="page-main-title">Recycle Submission</h1>
        <section class="form-card">
            <div class="form-card-header">
                <h2>File Attachment Form</h2>
                <p>Please upload files in png.</p>
            </div>
            <form class="gogreen-submission-form" onsubmit="event.preventDefault(); alert('Form submitted successfully!');">
                <div class="form-row-grid">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="Name" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="userEmail">E-mail</label>
                    <input type="email" id="userEmail" placeholder="user@example.com" required>
                    <span class="input-helper-text">example@example.com</span>
                </div>
                <div class="form-row-grid">
                    <div class="form-group">
                        <label for="materialType">Material Category</label>
                        <select id="materialType" required>
                            <option value="" disabled selected>Select material type</option>
                            <option value="plastic">Plastic</option>
                            <option value="paper">Paper</option>
                            <option value="aluminum">Aluminum</option>
                            <option value="glass">Glass Bottles</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="estimatedWeight">Estimated Weight (kg)</label>
                        <input type="number" id="estimatedWeight" step="0.1" min="0.1" placeholder="Weight(kg)" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Upload Documents (Proof)</label>
                    <div class="dropzone-wrapper" onclick="document.getElementById('fileUploadInput').click();">
                        <div class="dropzone-content">
                            <p class="upload-main-text">Upload a File</p>
                            <p class="upload-sub-text">Drag and drop files here or click to browse</p>
                        </div>
                        <input type="file" id="fileUploadInput" style="display: none;" onchange="updateFileInfo(this)">
                    </div>
                    <div id="fileInfoDisplay" class="file-info-banner" style="display: none;"></div>
                </div>
                <div class="form-group">
                    <label for="formComments">Comments</label>
                    <textarea id="formComments" rows="5" placeholder="Any comments"></textarea>
                </div>
                <div class="form-submit-wrapper">
                    <button type="submit" class="btn-submit-form">Submit Form</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p class="left-footer">
            © GoGreen. All rights reserved.
        </p>
        <p class="right-footer">
            Contact us: Al-Khawarizmi UTeM, Melaka, Malaysia
        </p>
    </footer>
    <script>
        function toggleMenu() {
            var menu = document.getElementById("navMenu");
            menu.classList.toggle("active");
        }
        function updateFileInfo(input) {
            var display = document.getElementById("fileInfoDisplay");
            if (input.files && input.files[0]) {
                display.innerHTML = "Selected File: <strong>" + input.files[0].name + "</strong>";
                display.style.display = "block";
            } else {
                display.style.display = "none";
            }
        }
    </script>
</body>
</html>
